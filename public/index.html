
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Generator Haseł</title>
<style>
body{font-family:Arial;max-width:900px;margin:40px auto}
label{display:block;margin:8px 0}
textarea{width:100%;height:220px}
button{padding:10px 20px}
</style>
</head>
<body>
<h1>Generator Haseł</h1>

<label>Długość hasła:
<input type="number" id="length" value="16" min="4" max="128">
</label>

<label>Słowo kluczowe:
<input type="text" id="keyword" placeholder="np. JK">
</label>

<label>Ilość haseł:
<input type="number" id="count" value="10" min="1" max="100">
</label>

<label><input type="checkbox" id="uppercase" checked> Duże litery</label>
<label><input type="checkbox" id="lowercase" checked> Małe litery</label>
<label><input type="checkbox" id="numbers" checked> Cyfry</label>
<label><input type="checkbox" id="symbols" checked> Znaki specjalne</label>

<button onclick="generatePasswords()">Generuj</button>

<h3>Wynik</h3>
<textarea id="result"></textarea>

<script>
async function generatePasswords(){
    const response = await fetch('/api/generate',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            length:document.getElementById('length').value,
            keyword: document.getElementById('keyword').value,
            count:document.getElementById('count').value,
            uppercase:document.getElementById('uppercase').checked,
            lowercase:document.getElementById('lowercase').checked,
            numbers:document.getElementById('numbers').checked,
            symbols:document.getElementById('symbols').checked
        })
    });

    const data = await response.json();
    document.getElementById('result').value = data.passwords.join('\n');
}
</script>
</body>
</html>
